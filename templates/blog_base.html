<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog{% endblock %} - Drone Commander</title>
    <meta name="description" content="{% block description %}Lore deep-dives and dev writing from the Drone Commander universe.{% endblock %}">
    <meta property="og:title" content="{{ self.title() }} - Drone Commander">
    <meta property="og:description" content="{{ self.description() }}">
    <meta property="og:image" content="https://dronecommander.gg/assets/{% block og_image %}img/cover.jpg{% endblock %}">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ self.title() }} - Drone Commander">
    <meta name="twitter:description" content="{{ self.description() }}">
    <meta name="twitter:image" content="https://dronecommander.gg/assets/{{ self.og_image() }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛸</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
        }

        .top-bar {
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid #00ffcc;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .top-bar .brand {
            color: #00ffcc;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .top-bar .brand:hover { text-shadow: 0 0 10px #00ffcc; }
        .top-bar .nav-link {
            display: inline-block;
            color: #00ffcc;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            padding: 6px 14px;
            border: 1px solid transparent;
            transition: 0.3s;
        }
        .top-bar .nav-link:hover {
            border-color: #00ffcc;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
        }

        .content-section {
            max-width: 780px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .text-glow { color: #00ffcc; }
        a.inline { color: #00ffcc; }

        /* Blog index */
        .blog-heading {
            color: #00ffcc;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0,255,204,0.5);
            margin-bottom: 6px;
        }
        .blog-sub { color: #888; margin-bottom: 30px; }
        .post-card {
            display: block;
            background: rgba(0,255,204,0.04);
            border: 1px solid rgba(0,255,204,0.2);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 24px;
            text-decoration: none;
            transition: 0.3s;
        }
        .post-card:hover {
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0,255,204,0.2);
        }
        .post-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            object-position: center 25%;
            display: block;
        }
        .post-card-body { padding: 20px 24px; }
        .post-card h2 {
            color: #00ffcc;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .post-card p { color: #bbb; margin: 0; font-size: 0.9rem; }
        .post-date {
            color: #777;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        /* Blog post */
        .post-title {
            color: #00ffcc;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0,255,204,0.5);
            margin-bottom: 8px;
        }
        .post-lead { color: #ccc; font-size: 1.05rem; margin: 18px 0 30px; }
        .post-body h2 {
            color: #00ffcc;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(0,255,204,0.3);
            padding-bottom: 8px;
            margin: 40px 0 16px;
        }
        .post-body p, .post-body li { color: #bbb; line-height: 1.7; }
        .post-body li { margin-bottom: 10px; }
        .post-body strong { color: #e0e0e0; }
        .post-body strong.text-glow { color: #00ffcc; }
        .post-body li > strong:first-child { color: #00ffcc; }
        .post-figure { margin: 30px 0; }
        .post-figure img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid rgba(0,255,204,0.3);
            box-shadow: 0 0 20px rgba(0,255,204,0.12);
            display: block;
        }
        .post-figure figcaption {
            color: #999;
            font-style: italic;
            font-size: 0.85rem;
            line-height: 1.6;
            margin-top: 10px;
            padding-left: 14px;
            border-left: 2px solid rgba(0,255,204,0.4);
        }
        .post-footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,255,204,0.15);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.85rem;
        }
        .post-footer a { color: #00ffcc; text-decoration: none; }
        .post-footer a:hover { text-shadow: 0 0 8px rgba(0,255,204,0.5); }

        @media (max-width: 576px) {
            .top-bar { flex-direction: column; gap: 6px; padding: 10px 12px; }
            .top-bar .nav-link { padding: 4px 8px; font-size: 0.75rem; }
            .blog-heading, .post-title { font-size: 1.5rem; }
            .post-card img { height: 180px; }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div class="top-bar">
        <a href="/" class="brand">Drone Commander</a>
        <div>
            <a href="/about" class="nav-link">About</a>
            <a href="/devlog" class="nav-link">Blogs</a>
            <a href="/compendium" class="nav-link">Compendium</a>
            <a href="/" class="nav-link">Hub</a>
        </div>
    </div>

    <div class="content-section">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
