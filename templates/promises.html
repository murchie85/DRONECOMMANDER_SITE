<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McMusty's Promises - Drone Commander</title>
    <meta name="description" content="Every promise McMusty has made to the Drone Commander community — tracked, dated, and marked implemented or not, with receipts.">
    <meta property="og:title" content="McMusty's Promises - Drone Commander">
    <meta property="og:description" content="Every promise made to the community — tracked with receipts.">
    <meta property="og:image" content="https://dronecommander.gg/assets/img/cover.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://dronecommander.gg/assets/img/cover.jpg">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛸</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#121212;color:#e0e0e0;font-family:'Courier New',monospace;min-height:100vh}
        a{color:#00ffcc;text-decoration:none}
        .top-bar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;
                 padding:12px 24px;background:rgba(10,10,10,.92);border-bottom:1px solid #00ffcc44;backdrop-filter:blur(6px)}
        .brand{font-weight:bold;color:#00ffcc;letter-spacing:1px}
        .nav-link{display:inline-block;color:#e0e0e0;margin-left:18px;font-size:.9rem}
        .nav-link:hover{color:#00ffcc}
        .hero-banner{text-align:center;padding:48px 16px 18px}
        .hero-banner h1{color:#00ffcc;letter-spacing:2px;text-shadow:0 0 18px #00ffcc55}
        .tagline{color:#8a8a8a;font-size:.95rem;max-width:640px;margin:0 auto}
        .container-wrap{max-width:900px;margin:0 auto;padding:0 16px 90px}

        /* stats */
        .stats-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:18px 0 26px}
        .stat-box{background:#181818;border:1px solid #262626;border-radius:8px;padding:12px 22px;text-align:center;min-width:120px}
        .stat-box .num{font-size:1.6rem;font-weight:bold;color:#00ffcc;text-shadow:0 0 10px #00ffcc44}
        .stat-box.s-impl .num{color:#7CFC9A}
        .stat-box.s-nope .num{color:#ff6b6b}
        .stat-box.s-open .num{color:#e0c34c}
        .stat-box .lbl{font-size:.68rem;color:#8a8a8a;letter-spacing:2px;text-transform:uppercase;margin-top:2px}

        /* filters */
        .filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
        .fbtn{background:#181818;border:1px solid #333;color:#aaa;border-radius:6px;padding:4px 12px;
              font-size:.78rem;font-family:inherit;letter-spacing:1px;cursor:pointer}
        .fbtn:hover{border-color:#00ffcc66;color:#e0e0e0}
        .fbtn.active{border-color:#00ffcc;color:#00ffcc;background:#0d1f1c}
        .fsearch{flex:1;min-width:180px;background:#0d0d0d;border:1px solid #333;color:#e0e0e0;
                 border-radius:6px;padding:5px 10px;font-family:inherit;font-size:.82rem}
        .fsearch:focus{outline:none;border-color:#00ffcc}

        /* promise rows */
        .p-row{background:#181818;border:1px solid #262626;border-left:3px solid #e0c34c88;
               border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
        .p-row.st-implemented{border-left-color:#7CFC9A}
        .p-row.st-not-doing{border-left-color:#ff6b6b;opacity:.8}
        .p-head{display:flex;align-items:center;gap:10px}
        .p-date{color:#666;font-size:.72rem;min-width:82px}
        .p-sum{flex:1;font-size:.88rem;min-width:0}
        .badge-x{font-size:.62rem;letter-spacing:1px;text-transform:uppercase;border-radius:5px;
                 padding:2px 7px;border:1px solid;white-space:nowrap}
        .b-firm{color:#00ffcc;border-color:#00ffcc55;background:#0d1f1c}
        .b-soft{color:#b98aff;border-color:#b98aff55;background:#171022}
        .b-implemented{color:#7CFC9A;border-color:#7CFC9A55;background:#102015}
        .b-not-doing{color:#ff6b6b;border-color:#ff6b6b55;background:#1f1010}
        .b-open{color:#e0c34c;border-color:#e0c34c55;background:#1f1a0d}
        .p-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #2e2e2e;
                  font-size:.82rem;color:#b5b5b5;line-height:1.55;white-space:pre-wrap;word-break:break-word}
        .p-row.expanded .p-detail{display:block}
        .p-reason{margin-top:8px;color:#ff9a9a}
        .p-reason strong{color:#ff6b6b}
        .p-note{margin-top:8px;color:#9fdcb4}
        .p-note strong{color:#7CFC9A}
        .p-link{display:inline-block;margin-top:8px;font-size:.75rem;border-bottom:1px dashed #00ffcc44}
        .empty-state{text-align:center;color:#8a8a8a;padding:60px 0}
        .count-note{color:#666;font-size:.75rem;margin-bottom:10px;letter-spacing:1px}
        @media (max-width:640px){
            .p-date{min-width:auto}
            .p-head{flex-wrap:wrap}
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/" class="brand">// Drone Commander</a>
        <div>
            <a href="/progress" class="nav-link">Progress</a>
            <a href="/devlog" class="nav-link">DevLog</a>
            <a href="/compendium" class="nav-link">Compendium</a>
            <a href="/" class="nav-link">Hub</a>
        </div>
    </div>

    <div class="hero-banner">
        <h1>// McMusty's Promises</h1>
        <p class="tagline">Every feature, fix and idea I've told the community I'd do — scraped from Discord, dated, and tracked. Implemented ones get marked; anything I'm not doing gets a reason. Receipts included.</p>
    </div>

    <div class="container-wrap">
        <div class="stats-row" id="stats"></div>

        <div class="filter-bar">
            <button class="fbtn active" data-f="status" data-v="all">All</button>
            <button class="fbtn" data-f="status" data-v="implemented">Implemented</button>
            <button class="fbtn" data-f="status" data-v="open">Open</button>
            <button class="fbtn" data-f="status" data-v="not-doing">Not Doing</button>
            <span style="width:10px"></span>
            <button class="fbtn" data-f="strength" data-v="all">Firm + Soft</button>
            <button class="fbtn" data-f="strength" data-v="firm">Firm</button>
            <button class="fbtn" data-f="strength" data-v="soft">Soft</button>
            <input class="fsearch" id="search" type="text" placeholder="search promises…">
        </div>

        <div class="count-note" id="countNote"></div>
        <div id="content"><div class="empty-state">Loading promises…</div></div>
    </div>

    <script>
    (async function(){
        const content = document.getElementById('content');
        let data;
        try {
            const res = await fetch('/assets/data/promises.json', { cache: 'no-store' });
            if (!res.ok) throw new Error(res.status);
            data = await res.json();
        } catch (err) {
            content.innerHTML = '<div class="empty-state">No promise data published yet — check back soon.</div>';
            return;
        }
        data.sort((a,b) => b.date.localeCompare(a.date));

        // stats
        const n = s => data.filter(p => p.status === s).length;
        const impl = n('implemented'), nope = n('not-doing'), open = data.length - impl - nope;
        document.getElementById('stats').innerHTML =
            `<div class="stat-box"><div class="num">${data.length}</div><div class="lbl">promises</div></div>` +
            `<div class="stat-box s-impl"><div class="num">${impl}</div><div class="lbl">implemented</div></div>` +
            `<div class="stat-box s-open"><div class="num">${open}</div><div class="lbl">open</div></div>` +
            `<div class="stat-box s-nope"><div class="num">${nope}</div><div class="lbl">not doing</div></div>`;

        const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const filters = { status:'all', strength:'all', q:'' };

        function statusOf(p){ return p.status === 'implemented' || p.status === 'not-doing' ? p.status : 'open'; }

        function render(){
            const q = filters.q.toLowerCase();
            const rows = data.filter(p => {
                const st = statusOf(p);
                if (filters.status !== 'all' && st !== filters.status) return false;
                if (filters.strength !== 'all' && p.strength !== filters.strength) return false;
                if (q && !(p.summary + ' ' + p.message).toLowerCase().includes(q)) return false;
                return true;
            });
            document.getElementById('countNote').textContent = `showing ${rows.length} of ${data.length}`;
            if (!rows.length){ content.innerHTML = '<div class="empty-state">Nothing matches.</div>'; return; }
            content.innerHTML = rows.map(p => {
                const st = statusOf(p);
                const stLabel = st === 'not-doing' ? 'not doing' : st;
                return `<div class="p-row st-${st}" data-id="${p.id}">
                    <div class="p-head">
                        <span class="p-date">${esc(p.date)}</span>
                        <span class="p-sum">${esc(p.summary)}</span>
                        <span class="badge-x b-${esc(p.strength)}">${esc(p.strength)}</span>
                        <span class="badge-x b-${st}">${stLabel}</span>
                    </div>
                    <div class="p-detail">${esc(p.message) || '<em>no quote captured</em>'}
                        ${st === 'not-doing' && p.reason ? `<div class="p-reason"><strong>Why not:</strong> ${esc(p.reason)}</div>` : ''}
                        ${st === 'implemented' && p.reason ? `<div class="p-note"><strong>Note:</strong> ${esc(p.reason)}</div>` : ''}
                        ${p.link ? `<a class="p-link" href="${esc(p.link)}" target="_blank" rel="noopener">view original message on Discord →</a>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        content.addEventListener('click', e => {
            if (e.target.closest('a')) return;
            const row = e.target.closest('.p-row');
            if (row) row.classList.toggle('expanded');
        });
        document.querySelectorAll('.fbtn').forEach(b => b.addEventListener('click', () => {
            document.querySelectorAll(`.fbtn[data-f="${b.dataset.f}"]`).forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            filters[b.dataset.f] = b.dataset.v;
            render();
        }));
        document.getElementById('search').addEventListener('input', e => { filters.q = e.target.value; render(); });

        render();
    })();
    </script>
</body>
</html>
